# ============================================================================
#  build-apk.yml -- Compila el motor nativo (ndk-build) y genera el APK.
#
#  Es el equivalente en la nube de BUILD_APK.bat, para poder publicar un APK
#  sin tener el Android SDK instalado en local.
#
#  Se ejecuta:
#     - al publicar un tag  v*   (y crea la Release adjuntando el APK)
#     - a mano con workflow_dispatch (solo sube el artefacto)
#
#  Salida:
#     NZP-Android-<version>-arm64.apk   (debug, arm64-v8a, instalable)
#
#  NOTA SOBRE VR: third_party/ esta en .gitignore, asi que en CI el SDK de
#  OpenXR no esta disponible. jni/Android.mk lo detecta y compila SIN VR
#  (todo el codigo VR esta bajo #ifdef NZP_VR_OPENXR). En local, con
#  third_party/OpenXR-SDK presente, se compila con VR exactamente igual.
# ============================================================================

name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar una GitHub Release con el APK'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358
  APK_BASENAME: NZP-Android-2.3.5

jobs:
  build:
    name: ndk-build + assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-app/**/*.gradle', 'android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Instalar NDK ${{ env.NDK_VERSION }} y plataforma Android 34
        run: |
          set -eux
          # En los runners de GitHub el SDK ya viene en $ANDROID_HOME.
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          sdkmanager --list_installed | grep -i ndk

      # system.c incluye "_build_info.h", que en local generan los scripts de
      # PowerShell (build_engine_android.ps1). vril-engine/build/ esta en
      # .gitignore, asi que en CI hay que crearlo antes de ndk-build.
      - name: Compilar QuakeC (progs.dat)
        run: |
          set -eux
          # OJO: android-app/.../base/nzp/progs.dat es un ARTEFACTO GENERADO.
          # Si no se recompila aqui, cualquier cambio en quakec/source/** llega
          # al APK solo si alguien reconstruye y commitea el .dat a mano.
          chmod +x quakec/bin/fteqcc-cli-lin quakec/tools/qc-compiler-gnu.sh
          python3 quakec/bin/qc_hash_generator.py \
            -i quakec/tools/asset_conversion_table.csv \
            -o quakec/source/server/hash_table.qc
          (cd quakec && ./bin/fteqcc-cli-lin -O3 -Ono-compound_jumps -Wall -srcfile progs/ssqc.src)
          cp quakec/build/standard/progs.dat \
             android-app/app/src/main/assets/base/nzp/progs.dat
          ls -l android-app/app/src/main/assets/base/nzp/progs.dat

      - name: Generar _build_info.h
        run: |
          set -eux
          mkdir -p vril-engine/build/android
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          cat > vril-engine/build/android/_build_info.h <<EOF_BUILD_INFO
          #define GIT_HASH "${SHORT_SHA}"
          #define GIT_BRANCH "${GITHUB_REF_NAME}"
          #define BUILD_DATE "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EOF_BUILD_INFO
          cat vril-engine/build/android/_build_info.h

      - name: Compilar motor nativo (ndk-build, arm64-v8a)
        id: ndk
        working-directory: vril-engine/source/platform/android
        run: |
          set -ux
          mkdir -p /tmp/ci-logs
          "$ANDROID_HOME/ndk/${NDK_VERSION}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j"$(nproc)" 2>&1 | tee /tmp/ci-logs/ndk-build.txt
          exit "${PIPESTATUS[0]}"

      - name: Copiar librerias nativas al proyecto Android
        run: |
          set -eux
          mkdir -p android-app/app/libs/arm64-v8a
          cp vril-engine/source/platform/android/libs/arm64-v8a/libmain.so android-app/app/libs/arm64-v8a/
          cp vril-engine/source/platform/android/libs/arm64-v8a/libSDL2.so android-app/app/libs/arm64-v8a/
          ls -l android-app/app/libs/arm64-v8a/

      - name: Generar local.properties del runner
        run: |
          set -eux
          # local.properties del repo apunta al SDK de Windows del usuario:
          # hay que sobrescribirlo con la ruta del runner.
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          cat android-app/local.properties

      - name: Generar APK (gradle assembleDebug)
        working-directory: android-app
        run: |
          set -eux
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -l app/build/outputs/apk/debug/

      # Diagnostico: el sandbox de desarrollo no puede descargar los logs de
      # Actions (results-receiver.actions.githubusercontent.com), asi que ante
      # un fallo se vuelcan a la rama ci-logs del propio repositorio, que SI es
      # legible con un simple git fetch.
      - name: Publicar logs de build en la rama ci-logs
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ux
          mkdir -p /tmp/ci-logs
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin ci-logs || true
          git checkout -B ci-logs || true
          rm -rf logs
          D="logs/run-$GITHUB_RUN_ID"
          mkdir -p "$D"
          # OJO: .gitignore ignora *.log, por eso el volcado usa .txt y se
          # fuerza el add (-f) para que nunca se pierda el diagnostico.
          {
            echo "== entorno =="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NDK_VERSION=$NDK_VERSION"
            echo
            echo "== \$ANDROID_HOME/ndk =="
            ls -la "$ANDROID_HOME/ndk/" 2>&1 || true
            echo
            echo "== ndk-build =="
            ls -la "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" 2>&1 || true
          } > "$D/diagnostico.txt" 2>&1
          cat /tmp/ci-logs/ndk-build.txt > "$D/ndk-build.txt" 2>/dev/null \
            || echo "(el paso de ndk-build no dejo log)" > "$D/ndk-build.txt"
          git add -A -f logs
          git commit -m "logs del run $GITHUB_RUN_ID (fallido)" || true
          git push origin HEAD:ci-logs --force

      - name: Empaquetar APK con nombre de version
        run: |
          set -eux
          mkdir -p out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "out/${APK_BASENAME}-arm64.apk"
          ls -l out/

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publicar GitHub Release con el APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then TAG="v2.3.5"; fi
          # Si la release ya existe (recompilacion del mismo tag) se sustituye
          # el APK en lugar de fallar.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "NZ:P Android 2.3.5" \
              --notes "APK generado automaticamente por GitHub Actions.

          - Version: 2.3.5 (versionCode 235)
          - ABI: arm64-v8a
          - Mapas de Tranzit (Green Run) y Town incluidos en los assets
          - El motor escribe un registro de cada sesion en
            Descargas/NZP_Logs/nzp-log-AAAAMMDD-HHMMSS.txt
            (imprescindible para diagnosticar los errores de Tranzit)
          - Build: debug (instalable tal cual; si ya tenias una version
            anterior firmada distinta, desinstalala antes)" \
              --latest
          fi
