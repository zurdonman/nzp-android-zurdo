def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
// El APK de Meta Quest 3 exige minSdk 29 (Meta no admite menos). ElAPK de
// telefono sigue en 21. Lo decide el workflow con -PnzpMinSdk=<n>.
def nzpMinSdk = (project.findProperty('nzpMinSdk') ?: '21').toString()
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "com.nzpteam.nzportable"
    }
    compileSdkVersion 34
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.nzpteam.nzportable"
        minSdkVersion Integer.parseInt(nzpMinSdk)
        targetSdkVersion 34
        versionCode 238
        versionName "2.3.8"
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
            assets.srcDirs = ['src/main/assets']
        }
    }
    lint {
        abortOnError false
    }
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "com.nzpteam.nzportable.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
